<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7D6DC">
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--blush:#FFF1F3;--petal:#F7D6DC;--rose:#D98A9B;--wine:#5B1A2E;--gold:#B8895A;--ink:#3A1220;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(120% 80% at 50% 0%,var(--blush),var(--petal));
background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hearts i{position:absolute;bottom:-40px;color:var(--rose);opacity:.35;font-style:normal;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.hearts i{animation:none;bottom:auto;top:20%}}
main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:36px 22px 48px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1;margin:0 0 10px;color:var(--wine);text-align:center}
.sub{font-family:var(--serif);font-style:italic;font-size:1.25rem;text-align:center;margin:0 0 28px;color:var(--wine);opacity:.8}
.hidden{display:none!important}
.dots{display:flex;justify-content:center;gap:12px;margin-bottom:10px;height:34px}
.dots span{font-size:28px;color:var(--rose);opacity:.35;transition:transform .25s,opacity .25s}
.dots span.on{opacity:1;transform:scale(1.15);color:var(--wine)}
.dots.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.msg{min-height:1.4em;text-align:center;font-size:.95rem;color:var(--wine);margin:0 0 18px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:0 auto}
.pad button{aspect-ratio:1;border-radius:50%;border:1px solid rgba(91,26,46,.15);background:rgba(255,255,255,.65);
font:500 1.6rem var(--serif);color:var(--wine);cursor:pointer;transition:background .15s,transform .1s}
.pad button:active{background:var(--rose);color:#fff;transform:scale(.95)}
.pad .blank{visibility:hidden}
.field{display:flex;flex-direction:column;gap:12px}
input[type=url]{width:100%;padding:16px 18px;border-radius:18px;border:1px solid rgba(91,26,46,.2);background:rgba(255,255,255,.8);
font:400 1rem var(--sans);color:var(--ink)}
input::placeholder{color:#a46b78}
.btn{padding:15px 18px;border:0;border-radius:999px;background:var(--wine);color:#fff;font:500 1rem var(--sans);cursor:pointer}
.btn.soft{background:rgba(255,255,255,.75);color:var(--wine);border:1px solid rgba(91,26,46,.2)}
.btn:disabled{opacity:.55}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{margin-top:24px;background:rgba(255,255,255,.7);border-radius:26px;padding:14px;border:1px solid rgba(91,26,46,.12)}
.card img{width:100%;border-radius:18px;display:block;aspect-ratio:16/9;object-fit:cover;background:var(--petal)}
.card h2{font-family:var(--serif);font-weight:500;font-size:1.35rem;line-height:1.2;margin:14px 4px 4px}
.card p{margin:0 4px 14px;font-size:.9rem;opacity:.7}
.actions{display:grid;gap:10px}
.note{text-align:center;font-family:var(--serif);font-style:italic;font-size:1.1rem;margin-top:22px;color:var(--wine)}
.err{color:#9b1c3b;text-align:center;margin-top:14px;min-height:1.2em;font-size:.95rem}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<main>
  <section id="lock">
    <h1>Just for you</h1>
    <p class="sub">Whisper our secret number</p>
    <div class="dots" id="dots" aria-label="Password progress"><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span></div>
    <p class="msg" id="lockMsg" role="status"></p>
    <div class="pad" id="pad"></div>
  </section>

  <section id="app" class="hidden">
    <h1 id="hello">Hello, love</h1>
    <p class="sub">Paste a link and I'll wrap it up for you</p>
    <div class="field">
      <input id="url" type="url" inputmode="url" placeholder="YouTube or TikTok link" autocomplete="off" aria-label="Video link">
      <button class="btn" id="find">Find it</button>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="card hidden" id="card">
      <img id="thumb" alt="">
      <h2 id="title"></h2>
      <p id="meta"></p>
      <div class="actions">
        <button class="btn" data-kind="video">Save video</button>
        <button class="btn soft" data-kind="audio">Save sound only</button>
        <button class="btn soft" data-kind="photo">Save cover photo</button>
      </div>
    </div>
    <p class="note">Made with all my love</p>
  </section>
</main>

<script>
const PARTNER_NAME = "Baby";
const $ = id => document.getElementById(id);
let code = "";

(() => { const h = $("hearts");
  for (let i = 0; i < 12; i++) { const e = document.createElement("i"); e.textContent = "♥";
    e.style.left = Math.random()*100 + "%"; e.style.fontSize = (14 + Math.random()*22) + "px";
    e.style.animationDuration = (14 + Math.random()*14) + "s"; e.style.animationDelay = (-Math.random()*20) + "s"; h.appendChild(e); } })();

["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k => {
  const b = document.createElement("button"); b.textContent = k; b.type = "button";
  if (!k) b.className = "blank"; else b.addEventListener("click", () => press(k));
  b.setAttribute("aria-label", k === "⌫" ? "Delete" : k || "");
  $("pad").appendChild(b);
});
addEventListener("keydown", e => { if ($("lock").classList.contains("hidden")) return;
  if (/^\d$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("⌫"); });

function paint(){ [...$("dots").children].forEach((d,i)=>d.classList.toggle("on", i < code.length)); }
async function press(k){
  if (k === "⌫") code = code.slice(0,-1); else if (code.length < 6) code += k;
  paint(); $("lockMsg").textContent = "";
  if (code.length < 6) return;
  try {
    const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({password:code})});
    if (r.ok) return unlock();
    const d = await r.json().catch(()=>({}));
    $("lockMsg").textContent = r.status === 429 ? d.error : "That's not our number. Try again, my love.";
  } catch { $("lockMsg").textContent = "Can't reach the server. Check your connection."; }
  $("dots").classList.add("shake"); setTimeout(()=>$("dots").classList.remove("shake"),400);
  code = ""; paint();
}
function unlock(){ $("lock").classList.add("hidden"); $("app").classList.remove("hidden");
  if (PARTNER_NAME) $("hello").textContent = "Hello, " + PARTNER_NAME; }
fetch("/api/me").then(r=>r.json()).then(d=>{ if (d.ok) unlock(); }).catch(()=>{});

async function post(path, body){ const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d = await r.json().catch(()=>({})); if (!r.ok) { if (r.status===401) location.reload(); throw new Error(d.error||"Something went wrong."); } return d; }
$("find").onclick = async () => {
  const url = $("url").value.trim(); $("err").textContent = ""; $("card").classList.add("hidden");
  if (!url) { $("err").textContent = "Paste a link first."; return; }
  $("find").disabled = true; $("find").textContent = "Looking…";
  try { const d = await post("/api/info",{url});
    $("thumb").src = d.thumbnail || ""; $("title").textContent = d.title;
    const m = d.duration ? Math.floor(d.duration/60)+":"+String(Math.floor(d.duration%60)).padStart(2,"0") : "";
    $("meta").textContent = [d.uploader, m].filter(Boolean).join("  ·  ");
    $("card").classList.remove("hidden");
  } catch(e){ $("err").textContent = e.message; }
  $("find").disabled = false; $("find").textContent = "Find it";
};

document.querySelectorAll("[data-kind]").forEach(btn => btn.onclick = async () => {
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Wrapping it up…"; $("err").textContent = "";
  try {
    const r = await fetch("/api/download?kind="+btn.dataset.kind+"&url="+encodeURIComponent($("url").value.trim()));
    if (!r.ok) { const d = await r.json().catch(()=>({})); throw new Error(d.error||"Download failed."); }
    const cd = r.headers.get("Content-Disposition")||""; const mt = /filename\*?=(?:UTF-8'')?"?([^";]+)/i.exec(cd);
    const name = mt ? decodeURIComponent(mt[1]) : "saved-file";
    const blob = await r.blob(); const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 60000);
    btn.textContent = "Saved ♥";
  } catch(e){ $("err").textContent = e.message; btn.textContent = label; }
  setTimeout(()=>{ btn.disabled = false; btn.textContent = label; }, 2500);
});
</script>
</body>
</html>
